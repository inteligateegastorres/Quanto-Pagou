services:
  postgres:
    image: postgres:16-alpine
    container_name: quantopagou-postgres
    environment:
      POSTGRES_USER: quantopagou
      POSTGRES_PASSWORD: quantopagou_dev
      POSTGRES_DB: quantopagou
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantopagou -d quantopagou"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    name: quantopagou_postgres_data
