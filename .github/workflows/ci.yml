# CI — roda em PR e push pra main.
#
# Garante que mudanças não quebram build/lint/types/tests basicos.
# Não roda banco_check ou schema_snapshot check (precisam stack viva
# com dados — fica para CI de integracao futura).
#
# Resolve critica externa (PLANO §17.A.10): "CI nao roda nada,
# qualquer PR pode quebrar build".

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + types + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: uv sync (deps + dev)
        run: python -m uv sync --all-extras

      - name: ruff check src/ scripts/ tests/
        run: python -m uv run ruff check src/ scripts/ tests/

      - name: mypy src/
        # mypy ainda em adocao — warnings ok, novos erros bloqueiam.
        # Para travar strict no futuro: tirar `continue-on-error`.
        continue-on-error: true
        run: python -m uv run mypy src/

      - name: pytest
        run: python -m uv run pytest -v

  frontend:
    name: frontend (lint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npx next lint
        # next lint cobre eslint-config-next; relaxado pra warnings.
        continue-on-error: true
        run: npx next lint

      - name: npx tsc --noEmit
        # Type-check estrito — bloqueia merge se quebrar.
        run: npx tsc --noEmit
