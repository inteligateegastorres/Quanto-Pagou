[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantopagou"
version = "0.0.1"
description = "Plataforma cívica para monitorar gastos públicos brasileiros e identificar possíveis desvios."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
    "rich>=13",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/api", "src/analytics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI usa Query()/Depends() em defaults — idiomatico, nao bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Codigo legacy com SQL inline e copy longo. Cleanup tracked em PLANO §17.B.
# Refactor de api/main.py em routers (§17.B.1) vai eliminar a maioria.
"src/api/main.py" = ["E501"]
"src/analytics/build_marts.py" = ["E501"]
"src/analytics/manchetes.py" = ["E501", "SIM117"]
"src/ingest/tce_pr.py" = ["E501", "SIM117"]
"src/ingest/compras.py" = ["SIM103"]
# Scripts: docstrings longos. Probe_* sao exploratorios (§17.B.4 vai
# mover pra _exploration/).
"scripts/*.py" = ["E501", "SIM117", "B007", "F841"]
"tests/qa/*.py" = ["E501", "SIM117"]
